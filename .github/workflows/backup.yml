name: Weekly Dropbox Backup

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          python3 -c "
          import os, json
          token = json.dumps({
            'access_token': '',
            'token_type': 'bearer',
            'refresh_token': os.environ['DROPBOX_REFRESH_TOKEN'],
            'expiry': '0001-01-01T00:00:00Z'
          })
          cfg = '[dropbox]\ntype = dropbox\nclient_id = {}\nclient_secret = {}\ntoken = {}\n'.format(
            os.environ['DROPBOX_APP_KEY'],
            os.environ['DROPBOX_APP_SECRET'],
            token
          )
          open(os.path.expanduser('~/.config/rclone/rclone.conf'), 'w').write(cfg)
          print('rclone config written')
          "

      - name: Create archive
        run: |
          DATE=$(date +%Y-%m-%d)
          REPO=$(basename $GITHUB_REPOSITORY)
          git archive --format=zip HEAD > /tmp/${REPO}-${DATE}.zip
          echo "BACKUP_FILE=/tmp/${REPO}-${DATE}.zip" >> $GITHUB_ENV
          echo "REPO_NAME=${REPO}" >> $GITHUB_ENV

      - name: Upload to Dropbox
        run: |
          rclone copy "$BACKUP_FILE" dropbox: --dropbox-chunk-size 150M
          echo "Uploaded $BACKUP_FILE to Dropbox"

      - name: Remove old backups (keep 5)
        run: |
          rclone lsf dropbox: --files-only | grep "^${REPO_NAME}-" | sort -r | tail -n +6 | while read f; do
            echo "Deleting old backup: $f"
            rclone delete "dropbox:${f}"
          done
