name: Weekly Dropbox Backup

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Create archive
        run: |
          DATE=$(date +%Y-%m-%d)
          REPO=$(basename $GITHUB_REPOSITORY)
          git archive --format=zip HEAD > /tmp/${REPO}-${DATE}.zip
          echo "BACKUP_FILE=/tmp/${REPO}-${DATE}.zip" >> $GITHUB_ENV
          echo "REPO_NAME=${REPO}" >> $GITHUB_ENV

      - name: Upload to Dropbox and cleanup
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          export RCLONE_CONFIG_DROPBOX_TYPE=dropbox
          export RCLONE_CONFIG_DROPBOX_CLIENT_ID="$DROPBOX_APP_KEY"
          export RCLONE_CONFIG_DROPBOX_CLIENT_SECRET="$DROPBOX_APP_SECRET"
          export RCLONE_CONFIG_DROPBOX_TOKEN=$(python3 -c "import os,json,sys; sys.stdout.write(json.dumps({'access_token':'','token_type':'bearer','refresh_token':os.environ['DROPBOX_REFRESH_TOKEN'],'expiry':'2020-01-01T00:00:00Z'},separators=(',',':')))")
          rclone copy "$BACKUP_FILE" dropbox: --dropbox-chunk-size 150M
          echo "Uploaded $BACKUP_FILE"
          rclone lsf dropbox: --files-only | grep "^${REPO_NAME}-" | sort -r | tail -n +6 | while read f; do
            echo "Deleting old backup: $f"
            rclone delete "dropbox:${f}"
          done
